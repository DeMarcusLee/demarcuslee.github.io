bio: |
 Zhifan Li (李智凡) is a tenure-track Associate Professor in the School of Statistics 
 and Mathematics at Zhongnan University of Economics and Law. He received his Ph.D.
 in Statistics in 2023 under the supervision of 
 Prof. [Jianxin Yin](http://stat.ruc.edu.cn/jszy/yjx1/index.html). He subsequently received
 research training under the supervision of Prof. [Qian Lin](https://www.stat.tsinghua.edu.cn/info/1023/2413.htm). 
 His research interests include statistical decision theory and theretical machine learning.

